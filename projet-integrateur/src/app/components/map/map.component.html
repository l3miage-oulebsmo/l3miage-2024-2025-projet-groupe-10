<div class="map-layout">
  <!-- Partie carte -->
  <div class="map-container">
    <!-- Ici tu gardes ta carte Leaflet -->
    <div leaflet [leafletOptions]="options" [leafletLayers]="allLayers()" [leafletZoom]="zoom()" [leafletCenter]="centre()"></div>
  </div>

  <!-- Partie tournées -->
  <div class="tournées-container">
    <h2>🗂️ Tournées</h2>
    <button (click)="buttonOptimization()">🚀 Optimiser la tournée</button>
    @for (tournee of tourneesList; track tournee.vehicle.id) {
      <div class="tournee-card">
        <h3>🚚 Véhicule #{{ tournee.vehicle.id }}</h3>
        <ul>
          @for (livreur of tournee.livreurs; track livreur.trigramme) {
            <li>
              {{ livreur.prenom }} {{ livreur.nom }} ({{ livreur.trigramme }})<br>
              📧 <a href="mailto:{{ livreur.email }}">{{ livreur.email }}</a>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</div>
